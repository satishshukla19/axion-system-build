apiVersion: apps/v1
kind: Deployment

metadata:
  name: ingestiondeployment
  labels:
    app: nginx1

spec:
  replicas: 1

  selector:
    matchLabels:
      app: nginx1

  template:
    metadata:
      labels:
        app: nginx1

    spec:
      containers:
        - name: ingestion-v1
          image: acrmicroservicesprod001.azurecr.io/axion-ingestion:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
