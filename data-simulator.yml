apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulator-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx2
  template:
    metadata:
      labels:
        app: nginx2
    spec:
      containers:
      - name: simulator
        image: acrmicroservicesprod001.azurecr.io/data-simulator:v1
        ports:
        - containerPort: 8000
